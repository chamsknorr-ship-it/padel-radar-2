<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padel Radar · Berlin</title>
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel Radar">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.heat/0.2.0/leaflet-heat.js"></script>
<style>
:root{
  --bg:#0e1116; --bg2:#161b22; --bg3:#1c232d; --line:#262d38; --line2:#323b48;
  --txt:#e8edf2; --muted:#9aa6b2; --faint:#6b7682;
  --acc:#c2f24a; --teal:#2dd4a7; --teal-dim:#1c8e72; --warn:#f0b429; --blue:#5aa9f0;
  --font-disp:'Bricolage Grotesque',sans-serif; --font:'Schibsted Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace; --r:12px; --r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased;padding:env(safe-area-inset-top) 0 0}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 64px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;border-radius:9px;border:2px solid var(--acc);position:relative;flex:none}
.logo:after{content:"";position:absolute;inset:0;margin:auto;width:6px;height:6px;border-radius:50%;background:var(--acc)}
.brand h1{font-family:var(--font-disp);font-weight:700;font-size:23px;letter-spacing:-.02em}
.brand .sub{font-size:13px;color:var(--muted)}
.updated{font-size:12px;color:var(--faint);font-family:var(--mono)}
.sample{display:inline-block;margin-top:8px;font-size:12px;color:#0e1116;background:var(--warn);padding:3px 10px;border-radius:99px;font-weight:600}

.tabs{display:flex;gap:6px;margin:16px 0 14px;border-bottom:1px solid var(--line)}
.tab{background:none;border:none;color:var(--muted);font-family:var(--font);font-size:15px;padding:9px 4px;margin-right:14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--txt);border-bottom-color:var(--acc)}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 8px}
.seg{display:flex;flex-wrap:wrap;background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{background:none;border:none;color:var(--muted);font-family:var(--font);font-size:14px;padding:7px 14px;border-radius:99px;cursor:pointer;transition:.12s;white-space:nowrap}
.seg button.on{background:var(--acc);color:#0e1116;font-weight:600}
.daterange{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.daterange.on{display:flex}
.daterange label{font-size:13px;color:var(--muted)}
.daterange input{background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-size:14px;padding:7px 10px;border-radius:var(--r-sm);color-scheme:dark;outline:none}
.search{flex:1;min-width:150px}
.search input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-size:14px;padding:9px 13px;border-radius:var(--r-sm);outline:none}
.sort select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);font-family:var(--font);font-size:14px;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer}
.rangelabel{font-size:12px;color:var(--faint);font-family:var(--mono);margin:2px 0 16px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:25px;font-weight:500;margin-top:6px;letter-spacing:-.02em}
.kpi .v.acc{color:var(--acc)}

.section-h{font-size:13px;color:var(--muted);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--line2);background:var(--bg3)}
.row .rank{font-family:var(--mono);font-size:14px;color:var(--faint)}
.row .nm{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ds{font-size:12px;color:var(--muted)}
.row .rev{font-family:var(--mono);font-size:16px;text-align:right;white-space:nowrap}
.row .meta{font-size:12px;color:var(--muted);text-align:right;margin-top:3px;white-space:nowrap}
.bar{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;display:flex;margin-top:8px}
.bar .m{background:var(--teal)}
.bar .e{background:repeating-linear-gradient(45deg,var(--teal-dim) 0 4px,transparent 4px 8px)}
.legend{display:flex;gap:18px;margin-top:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}.sw{width:11px;height:11px;border-radius:3px}
.empty{color:var(--faint);font-size:14px;padding:26px 0;text-align:center}

.tbar{margin-bottom:11px}
.tbar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
.tbar .t .r{color:var(--muted);font-family:var(--mono);font-size:13px}
.tbar .track{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.tbar .fill{height:100%;border-radius:99px}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.card h3{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:640px){.two{grid-template-columns:1fr;gap:0}}

.overlay{position:fixed;inset:0;background:rgba(6,9,13,.72);display:none;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;z-index:50}
.overlay.on{display:flex}
.panel{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;max-width:720px;width:100%;padding:22px;margin:auto}
.panel .back{background:none;border:1px solid var(--line2);color:var(--muted);font-family:var(--font);font-size:13px;padding:7px 13px;border-radius:99px;cursor:pointer;margin-bottom:16px}
.panel h2{font-family:var(--font-disp);font-weight:600;font-size:21px;letter-spacing:-.02em}
.panel .dsub{font-size:13px;color:var(--muted);margin:2px 0 18px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:22px}
.mcard{background:var(--bg);border-radius:var(--r);padding:13px 15px}
.mcard .l{font-size:12px;color:var(--muted)}.mcard .v{font-family:var(--mono);font-size:23px;font-weight:500;margin-top:5px}
.mcard .x{font-size:11px;color:var(--faint);margin-top:3px}
.dh{font-size:13px;color:var(--muted);margin:20px 0 12px}
.ev{display:flex;gap:11px;align-items:flex-start;background:var(--bg);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px}
.ev .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);margin-top:6px;flex:none}
.ev .n{font-size:14px;font-weight:500}.ev .nt{font-size:12px;color:var(--muted)}
.foot{margin-top:34px;font-size:12px;color:var(--faint);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
@media(max-width:560px){.brand h1{font-size:20px}.row{grid-template-columns:22px 1fr auto;gap:10px;padding:12px}.kpi .v{font-size:22px}}

#map{height:560px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;background:var(--bg2)}
.leaflet-container{background:#0b0e12;font-family:var(--font)}
.leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-control-zoom a{background:var(--bg2)!important;color:var(--txt)!important;border-color:var(--line)!important}
.leaflet-control-zoom a:hover{background:var(--bg3)!important}
.leaflet-bar{border-color:var(--line)!important;box-shadow:none!important}
.leaflet-tooltip{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);box-shadow:0 4px 14px rgba(0,0,0,.4);font-size:13px}
.leaflet-tooltip-top:before{border-top-color:var(--line2)}
.leaflet-control-attribution{background:rgba(14,17,22,.7)!important;color:var(--faint)!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.maplegend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--muted)}
.maplegend .grad{flex:1;max-width:240px;height:8px;border-radius:99px;background:linear-gradient(90deg,#1c8e72,#2dd4a7,#c2f24a,#f0b429,#f0654a)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand"><div class="logo"></div>
        <div><h1>Padel Radar</h1><div class="sub">Wettbewerbs-Monitoring · Berlin</div></div>
      </div>
      <div id="sample-badge"></div>
    </div>
    <div class="updated" id="updated"></div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="clubs">Clubs</button>
    <button class="tab" data-tab="report">Bericht</button>
    <button class="tab" data-tab="map">Karte</button>
  </div>

  <div class="controls">
    <div class="seg" id="seg">
      <button data-p="today">Heute</button>
      <button data-p="week" class="on">Woche</button>
      <button data-p="month">Monat</button>
      <button data-p="custom">Eigener Zeitraum</button>
    </div>
    <div class="daterange" id="daterange">
      <label>von <input type="date" id="d-from"></label>
      <label>bis <input type="date" id="d-to"></label>
    </div>
  </div>
  <div class="controls" id="clubs-controls">
    <div class="sort"><select id="sort">
      <option value="rev">Sortieren: Umsatz</option>
      <option value="occ">Sortieren: Auslastung</option>
      <option value="name">Sortieren: Name</option>
    </select></div>
    <div class="search"><input id="search" type="search" placeholder="Club oder Bezirk suchen…"></div>
  </div>
  <div class="rangelabel" id="rangelabel"></div>

  <div id="clubs-view">
    <div class="kpis" id="kpis"></div>
    <div class="section-h" id="list-title">Clubs nach geschätztem Umsatz</div>
    <div class="list" id="list"></div>
    <div class="legend">
      <span><span class="sw" style="background:var(--teal)"></span>gemessen (live erfasst)</span>
      <span><span class="sw" style="background:repeating-linear-gradient(45deg,var(--teal-dim) 0 3px,transparent 3px 6px)"></span>geschätzt (Altbestand)</span>
    </div>
  </div>

  <div id="report-view" style="display:none"></div>

  <div id="map-view" style="display:none">
    <div class="section-h">Buchungsaufkommen in Berlin · je heller/röter, desto mehr gebucht im gewählten Zeitraum</div>
    <div id="map"></div>
    <div class="maplegend"><span>weniger</span><span class="grad"></span><span>mehr gebucht</span>
      <span style="margin-left:auto;color:var(--faint)">Punkt antippen für Details · zoomen mit + / −</span></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
const FALLBACK={updated_at:new Date().toISOString(),city:"Berlin",sample:true,
  date_min:new Date().toISOString().slice(0,10),date_max:new Date().toISOString().slice(0,10),
  venues:[{tenant_id:"x",name:"Beispiel-Club",district:"Berlin",lat:52.52,lng:13.40,courts:4,
    capacity:{"Double · Indoor":3120},court_types:[{label:"Double · Indoor",courts:4}],
    daily:{[new Date().toISOString().slice(0,10)]:{rev_m:120,rev_e:300,measured_min:240,types:{"Double · Indoor":{b:600,r:420}},tod:{Abend:240},dur:{"1h":4}}},events:[]}]};

let DATA=null, tab="clubs", preset="week", sortBy="rev", query="";
let reportLoc="all", chartMode="occ";
let cFrom=null, cTo=null;
const $=id=>document.getElementById(id);
const eur=n=>"€"+Math.round(n).toLocaleString("de-DE");
const pct=n=>Math.round(n*100)+"%";
const capOcc=n=>Math.min(1,n||0);
const ddmm=iso=>{const[y,m,d]=iso.split("-");return d+"."+m+".";};
const maxS=(a,b)=>a>b?a:b, minS=(a,b)=>a<b?a:b;

function* eachDate(from,to){let[y,m,d]=from.split("-").map(Number);let cur=Date.UTC(y,m-1,d);
  const[Y,M,D]=to.split("-").map(Number);const end=Date.UTC(Y,M-1,D);
  while(cur<=end){yield new Date(cur).toISOString().slice(0,10);cur+=86400000;}}
function weekdayOf(iso){const[y,m,d]=iso.split("-").map(Number);
  return["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(Date.UTC(y,m-1,d)).getUTCDay()];}
function todayISO(){return new Date().toISOString().slice(0,10);}

function currentRange(){
  const dmin=DATA.date_min, dmax=DATA.date_max, t=todayISO();
  if(preset==="custom") return [maxS(cFrom||dmin,dmin), minS(cTo||dmax,dmax)];
  if(preset==="today")  return [maxS(t,dmin), minS(t,dmax)];
  if(preset==="week"){const[y,m,d]=t.split("-").map(Number);const dt=new Date(Date.UTC(y,m-1,d));
    const dow=(dt.getUTCDay()+6)%7;const mon=new Date(dt);mon.setUTCDate(dt.getUTCDate()-dow);
    const sun=new Date(mon);sun.setUTCDate(mon.getUTCDate()+6);
    return [maxS(mon.toISOString().slice(0,10),dmin), minS(sun.toISOString().slice(0,10),dmax)];}
  if(preset==="month"){const[y,m]=t.split("-");const first=`${y}-${m}-01`;
    const last=new Date(Date.UTC(+y,+m,0)).toISOString().slice(0,10);
    return [maxS(first,dmin), minS(last,dmax)];}
  return [dmin,dmax];
}

function computeRange(v,from,to,locFilter){
  let nDays=0,bookedAll=0,rev_m=0,rev_e=0,mm=0;
  const typeB={},typeR={},tod={},dur={},wd={};
  const vorlauf={},wdAdv={};
  const loc={},hours={};
  const lf=locFilter&&locFilter!=="all"?locFilter:null;
  for(const iso of eachDate(from,to)){const rec=v.daily[iso];if(!rec)continue;nDays++;
    rev_m+=rec.rev_m||0;rev_e+=rec.rev_e||0;mm+=rec.measured_min||0;
    const w=weekdayOf(iso);wd[w]=(wd[w]||0)+(rec.measured_min||0);
    for(const k in rec.types){typeB[k]=(typeB[k]||0)+rec.types[k].b;typeR[k]=(typeR[k]||0)+rec.types[k].r;bookedAll+=rec.types[k].b;}
    for(const k in rec.tod) tod[k]=(tod[k]||0)+rec.tod[k];
    for(const k in rec.dur) dur[k]=(dur[k]||0)+rec.dur[k];
    for(const k in (rec.loc||{})){loc[k]=loc[k]||{b:0,r:0};loc[k].b+=rec.loc[k].b;loc[k].r+=rec.loc[k].r;}
    for(const k in (rec.hours||{})){hours[k]=hours[k]||{b:0,r:0};hours[k].b+=rec.hours[k].b;hours[k].r+=rec.hours[k].r;}
    for(const k in (rec.vorlauf||{})) vorlauf[k]=(vorlauf[k]||0)+rec.vorlauf[k];
    for(const k in (rec.wd_adv||{})){const x=rec.wd_adv[k];wdAdv[k]=wdAdv[k]||{s:0,n:0};wdAdv[k].s+=x.s;wdAdv[k].n+=x.n;}}
  const cap1=Object.values(v.capacity||{}).reduce((a,b)=>a+b,0);
  const typeCap={};for(const k in (v.capacity||{}))typeCap[k]=v.capacity[k]*nDays;
  let booked=bookedAll, cap=cap1*nDays, rev=rev_m+rev_e, rM=rev_m, rE=rev_e;
  if(lf){const L=loc[lf]||{b:0,r:0};booked=L.b;rev=L.r;rM=L.r;rE=0;
    cap=((v.cap_loc||{})[lf]||0)*nDays;}
  const avgPrice=booked>0?rev/(booked/60):0;
  return {nDays,booked,cap,rev_m:rM,rev_e:rE,rev,mm,typeB,typeR,typeCap,tod,dur,wd,vorlauf,wdAdv,loc,hours,avgPrice,lf};
}

function tbar(label,frac,right,color){return `<div class="tbar"><div class="t"><span>${label}</span>
  <span class="r">${right}</span></div><div class="track"><div class="fill" style="width:${Math.round(frac*100)}%;background:${color}"></div></div></div>`;}
function barShares(obj,order,color){const tot=order.reduce((a,k)=>a+(obj[k]||0),0);
  if(tot<=0)return '<div class="empty" style="padding:12px 0">Noch keine gemessenen Buchungen.</div>';
  return order.map(k=>tbar(k,(obj[k]||0)/tot,Math.round((obj[k]||0)/tot*100)+"%",color)).join("");}

const TODO=["Vormittag","Mittag","Nachmittag","Abend","Nachts"];
const WDO=["Mo","Di","Mi","Do","Fr","Sa","So"];
const DURO=["1h","1,5h","2h"];

// Zeitachsen-Diagramm (SVG-Balken). buckets: [{label, occ, rev}]
function timeChart(buckets,mode){
  if(!buckets.length||buckets.every(b=>(mode==="rev"?b.rev:b.occ)===0))
    return '<div class="empty" style="padding:30px 0">Noch keine Daten im Zeitraum.</div>';
  const W=Math.max(560,buckets.length*Math.max(26,Math.min(60,560/buckets.length))),H=240;
  const padL=44,padB=34,padT=14,padR=10;
  const cw=W-padL-padR, ch=H-padB-padT;
  const vals=buckets.map(b=>mode==="rev"?b.rev:b.occ);
  const max=Math.max(...vals)||1;
  const bw=cw/buckets.length, barW=Math.min(40,bw*0.66);
  const col=mode==="rev"?"var(--teal)":"var(--acc)";
  const fmt=v=>mode==="rev"?eur(v):Math.round(v*100)+"%";
  // Y-Gitter (4 Linien)
  let grid="",yl="";
  for(let i=0;i<=4;i++){const y=padT+ch-ch*i/4;const val=max*i/4;
    grid+=`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--line)" stroke-width="1"/>`;
    yl+=`<text x="${padL-6}" y="${y+3}" text-anchor="end" fill="var(--faint)" font-size="10" font-family="var(--mono)">${fmt(val)}</text>`;}
  let bars="",xl="";
  buckets.forEach((b,i)=>{const v=mode==="rev"?b.rev:b.occ;const h=ch*v/max;
    const x=padL+i*bw+(bw-barW)/2;const y=padT+ch-h;
    bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="3" fill="${col}"><title>${b.label}: ${fmt(v)}</title></rect>`;
    const showEvery=buckets.length>16?Math.ceil(buckets.length/16):1;
    if(i%showEvery===0)xl+=`<text x="${padL+i*bw+bw/2}" y="${H-padB+16}" text-anchor="middle" fill="var(--muted)" font-size="10">${b.label}</text>`;});
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${W>700?W:0}px;max-width:100%;display:block">
    ${grid}${yl}${bars}${xl}</svg></div>`;
}

// Zeitachsen-Buckets für ganz Berlin (oder gefiltert nach Lage)
function cityBuckets(from,to,lf){
  let nd=0;for(const _ of eachDate(from,to))nd++;
  const venues=DATA.venues;
  const capDayOf=v=>lf?((v.cap_loc||{})[lf]||0):Object.values(v.capacity||{}).reduce((a,b)=>a+b,0);
  // Modus 1: genau 1 Tag -> Stunden
  if(nd===1){
    const H={};
    venues.forEach(v=>{const rec=v.daily[from];if(!rec)return;
      for(const k in (rec.hours||{})){const h=+k;H[h]=H[h]||{b:0,r:0};H[h].b+=rec.hours[k].b;H[h].r+=rec.hours[k].r;}});
    const hoursOpen=18;
    const capH=venues.reduce((s,v)=>s+capDayOf(v),0)/hoursOpen;
    const hrs=Object.keys(H).map(Number);
    const lo=hrs.length?Math.min(...hrs,9):9, hi=hrs.length?Math.max(...hrs,21):21;
    const out=[];for(let h=lo;h<=hi;h++){const x=H[h]||{b:0,r:0};
      out.push({label:h+"h",occ:capH?Math.min(1,x.b/capH):0,rev:x.r});}
    return out;
  }
  // Modus 2: <=8 Tage -> je Wochentag
  if(nd<=8){
    const acc={};WDO.forEach(k=>acc[k]={b:0,cap:0,r:0});
    for(const iso of eachDate(from,to)){const w=weekdayOf(iso);
      venues.forEach(v=>{const rec=v.daily[iso];if(!rec)return;acc[w].cap+=capDayOf(v);
        if(lf){const L=(rec.loc||{})[lf];if(L){acc[w].b+=L.b;acc[w].r+=L.r;}}
        else{for(const k in rec.types){acc[w].b+=rec.types[k].b;acc[w].r+=rec.types[k].r;}}});}
    return WDO.map(k=>({label:k,occ:acc[k].cap?Math.min(1,acc[k].b/acc[k].cap):0,rev:acc[k].r}));
  }
  // Modus 3: je Tag
  const out=[];
  for(const iso of eachDate(from,to)){let b=0,cap=0,r=0;
    venues.forEach(v=>{const rec=v.daily[iso];cap+=capDayOf(v);if(!rec)return;
      if(lf){const L=(rec.loc||{})[lf];if(L){b+=L.b;r+=L.r;}}
      else{for(const k in rec.types){b+=rec.types[k].b;r+=rec.types[k].r;}}});
    out.push({label:ddmm(iso).replace(/\.$/,''),occ:cap?Math.min(1,b/cap):0,rev:r});}
  return out;
}

function renderRangeLabel(){const[f,t]=currentRange();
  let nd=0;for(const _ of eachDate(f,t))nd++;
  $("rangelabel").textContent=`${ddmm(f)}–${ddmm(t)} · ${nd} Tag${nd===1?"":"e"}`;}

/* ---------- Clubs-Ansicht ---------- */
function renderKPIs(from,to){
  let cap=0,book=0,rev=0,ev=0;
  DATA.venues.forEach(v=>{const c=computeRange(v,from,to);cap+=c.cap;book+=c.booked;rev+=c.rev;
    ev+=(v.events||[]).filter(e=>e.date>=from&&e.date<=to).length;});
  const cards=[["Clubs erfasst",DATA.venues.length,""],["Ø Auslastung",pct(capOcc(cap?book/cap:0)),""],
    ["Umsatz · Zeitraum",eur(rev),"acc"],["Events erkannt",ev,""]];
  $("kpis").innerHTML=cards.map(c=>`<div class="kpi"><div class="l">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join("");
}
function renderList(from,to){
  let vs=DATA.venues.map(v=>({v,c:computeRange(v,from,to)}));
  vs=vs.filter(x=>{if(!query)return true;const q=query.toLowerCase();
    return x.v.name.toLowerCase().includes(q)||(x.v.district||"").toLowerCase().includes(q);});
  vs.sort((a,b)=>sortBy==="name"?a.v.name.localeCompare(b.v.name):sortBy==="occ"
    ?(b.c.cap?b.c.booked/b.c.cap:0)-(a.c.cap?a.c.booked/a.c.cap:0):b.c.rev-a.c.rev);
  const max=Math.max(1,...vs.map(x=>x.c.rev));
  if(!vs.length){$("list").innerHTML='<div class="empty">Keine Clubs gefunden.</div>';return;}
  $("list").innerHTML=vs.map((x,i)=>{const c=x.c,occ=capOcc(c.cap?c.booked/c.cap:0);
    const mw=c.rev_m/max*100,ew=c.rev_e/max*100;const idx=DATA.venues.indexOf(x.v);
    return `<div class="row" onclick="openDetail(${idx})"><span class="rank">${i+1}</span>
      <div style="min-width:0">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <span class="nm">${x.v.name}</span><span class="rev">${eur(c.rev)}</span></div>
        <div style="display:flex;justify-content:space-between;gap:10px">
          <span class="ds">${x.v.district||""}</span>
          <span class="meta">${pct(occ)} Auslastung · ${x.v.courts} Courts</span></div>
        <div class="bar"><div class="m" style="width:${mw}%"></div><div class="e" style="width:${ew}%"></div></div>
      </div><span style="color:var(--faint);font-size:18px">›</span></div>`;}).join("");
}
function openDetail(idx){const[from,to]=currentRange();const v=DATA.venues[idx];const c=computeRange(v,from,to);
  const occ=capOcc(c.cap?c.booked/c.cap:0);
  const types=(v.court_types||[]).map(t=>({label:t.label,courts:t.courts,
    occ:capOcc(c.typeCap[t.label]?(c.typeB[t.label]||0)/c.typeCap[t.label]:0),rev:c.typeR[t.label]||0}));
  const maxT=Math.max(1,...types.map(t=>t.rev));
  const typeHtml=types.length?types.map(t=>tbar(`${t.label} · ${t.courts} C`,t.rev/maxT,pct(t.occ)+" · "+eur(t.rev),"var(--blue)")).join(""):'<div class="empty">–</div>';
  const evs=(v.events||[]).filter(e=>e.date>=from&&e.date<=to);
  const evHtml=evs.length?evs.map(e=>`<div class="ev"><span class="dot"></span><div><div class="n">${e.name} · ${ddmm(e.date)}</div><div class="nt">${e.note||""}</div></div></div>`).join(""):'<div class="empty" style="padding:12px 0">Keine Events erkannt.</div>';
  // Vorlaufzeit
  const VORO=["<2h","<6h","Gleicher Tag","1 Tag","2 Tage","3–7 Tage","8–14 Tage","15–30 Tage"];
  const vtot=VORO.reduce((a,k)=>a+(c.vorlauf[k]||0),0);
  const vorlaufHtml=vtot>0
    ?VORO.map(k=>tbar(k,(c.vorlauf[k]||0)/vtot,Math.round((c.vorlauf[k]||0)/vtot*100)+"%","var(--acc)")).join("")
    :'<div class="empty" style="padding:12px 0">Noch keine gemessenen Buchungen.</div>';
  // Wochentag mit Ø Vorlauf
  const wtot=WDO.reduce((a,k)=>a+(c.wd[k]||0),0)||1;
  const wdHtml=WDO.length&&wtot>0
    ?WDO.map(k=>{const avg=c.wdAdv[k]&&c.wdAdv[k].n>0?(c.wdAdv[k].s/c.wdAdv[k].n).toFixed(1):null;
      const lbl=avg!==null?`${k} · Ø ${avg} T`:k;
      return tbar(lbl,(c.wd[k]||0)/wtot,Math.round((c.wd[k]||0)/wtot*100)+"%","var(--blue)");}).join("")
    :'<div class="empty" style="padding:12px 0">Noch keine gemessenen Buchungen.</div>';
  $("panel").innerHTML=`<button class="back" onclick="closeDetail()">‹ zurück</button>
    <h2>${v.name}</h2><div class="dsub">${v.district||""} · ${v.courts} Courts · ${ddmm(from)}–${ddmm(to)} · ${c.nDays} beob. Tage</div>
    <div class="mcards">
      <div class="mcard"><div class="l">Auslastung</div><div class="v">${pct(occ)}</div></div>
      <div class="mcard"><div class="l">Umsatz gesamt</div><div class="v">${eur(c.rev)}</div><div class="x">${eur(c.rev_m)} gemessen · ${eur(c.rev_e)} geschätzt</div></div>
      <div class="mcard"><div class="l">Gebuchte Std.</div><div class="v">${Math.round(c.booked/60)}</div></div>
      <div class="mcard"><div class="l">Ø-Preis / Std.</div><div class="v">${eur(c.avgPrice)}</div><div class="x">über gebuchte Courts</div></div>
    </div>
    <div class="dh">Nach Court-Typ · Auslastung &amp; Umsatz</div>${typeHtml}
    <div class="dh">Nach Buchungslänge · Anteil</div>${barShares(c.dur,DURO,"var(--warn)")}
    <div class="dh">Nach Tageszeit · Anteil</div>${barShares(c.tod,TODO,"var(--teal)")}
    <div class="dh">Nach Wochentag · Anteil</div>${wdHtml}
    <div class="dh">Vorlaufzeit · Anteil gemessener Buchungen</div>${vorlaufHtml}
    <div class="dh">Events &amp; Turniere</div>${evHtml}`;
  $("overlay").classList.add("on");document.body.style.overflow="hidden";
}
function closeDetail(){$("overlay").classList.remove("on");document.body.style.overflow="";}
$("overlay").addEventListener("click",e=>{if(e.target===$("overlay"))closeDetail();});

/* ---------- Bericht-Ansicht (ganz Berlin) ---------- */
function renderReport(from,to){
  const lf=reportLoc==="all"?null:reportLoc;
  let cap=0,book=0,rev=0,rev_m=0,rev_e=0,courts=0,ev=0;
  const typeB={},typeR={},typeCap={},tod={},dur={},wd={},vorlauf={},wdAdv={};
  const per=[];
  DATA.venues.forEach(v=>{const c=computeRange(v,from,to,reportLoc);cap+=c.cap;book+=c.booked;rev+=c.rev;rev_m+=c.rev_m;rev_e+=c.rev_e;
    courts+=lf?courtsOfLoc(v,lf):v.courts;ev+=(v.events||[]).filter(e=>e.date>=from&&e.date<=to).length;
    for(const k in c.tod)tod[k]=(tod[k]||0)+c.tod[k];
    for(const k in c.dur)dur[k]=(dur[k]||0)+c.dur[k];
    for(const k in c.wd)wd[k]=(wd[k]||0)+c.wd[k];
    for(const k in c.vorlauf)vorlauf[k]=(vorlauf[k]||0)+c.vorlauf[k];
    for(const k in c.wdAdv){wdAdv[k]=wdAdv[k]||{s:0,n:0};wdAdv[k].s+=c.wdAdv[k].s;wdAdv[k].n+=c.wdAdv[k].n;}
    // Court-Typ nur passend zur Lage zeigen
    for(const k in c.typeB){if(lf&&!k.toLowerCase().includes(lf==="indoor"?"indoor":"outdoor"))continue;
      typeB[k]=(typeB[k]||0)+c.typeB[k];typeR[k]=(typeR[k]||0)+c.typeR[k];}
    for(const k in c.typeCap){if(lf&&!k.toLowerCase().includes(lf==="indoor"?"indoor":"outdoor"))continue;
      typeCap[k]=(typeCap[k]||0)+c.typeCap[k];}
    per.push({name:v.name,occ:capOcc(c.cap?c.booked/c.cap:0),rev:c.rev});});
  const occ=capOcc(cap?book/cap:0);
  const avgPrice=book>0?rev/(book/60):0;
  const types=Object.keys(typeCap).sort();
  const maxTr=Math.max(1,...types.map(t=>typeR[t]||0));
  const typeHtml=types.length?types.map(t=>tbar(t,(typeR[t]||0)/maxTr,
    pct(capOcc(typeCap[t]?(typeB[t]||0)/typeCap[t]:0))+" · "+eur(typeR[t]||0),"var(--blue)")).join(""):'<div class="empty">–</div>';
  const wtot=WDO.reduce((a,k)=>a+(wd[k]||0),0)||1;
  const wdHtml=WDO.map(k=>{const avg=wdAdv[k]&&wdAdv[k].n>0?(wdAdv[k].s/wdAdv[k].n).toFixed(1):null;
    const lbl=avg!==null?`${k} · Ø ${avg} T`:k;
    return tbar(lbl,(wd[k]||0)/wtot,Math.round((wd[k]||0)/wtot*100)+"%","var(--blue)");}).join("")||
    '<div class="empty">Noch keine gemessenen Buchungen.</div>';
  const VORO=["<2h","<6h","Gleicher Tag","1 Tag","2 Tage","3–7 Tage","8–14 Tage","15–30 Tage"];
  const vtot=VORO.reduce((a,k)=>a+(vorlauf[k]||0),0);
  const vorlaufHtml=vtot>0
    ?VORO.map(k=>tbar(k,(vorlauf[k]||0)/vtot,Math.round((vorlauf[k]||0)/vtot*100)+"%","var(--acc)")).join("")
    :'<div class="empty">Noch keine gemessenen Buchungen.</div>';
  const topRev=[...per].sort((a,b)=>b.rev-a.rev).slice(0,5);
  const topOcc=[...per].sort((a,b)=>b.occ-a.occ).slice(0,5);
  const maxR=Math.max(1,...topRev.map(x=>x.rev));
  // Zeitachsen-Chart
  const buckets=cityBuckets(from,to,lf);
  const chart=timeChart(buckets,chartMode);
  const xachse=buckets.length&&buckets[0].label.endsWith("h")?"je Stunde":(WDO.includes(buckets[0]?.label)?"je Wochentag":"je Tag");
  $("report-view").innerHTML=`
    <div class="seg" id="locseg" style="margin-bottom:14px">
      <button data-loc="all"${reportLoc==="all"?' class="on"':''}>Alle Courts</button>
      <button data-loc="indoor"${reportLoc==="indoor"?' class="on"':''}>Indoor</button>
      <button data-loc="outdoor"${reportLoc==="outdoor"?' class="on"':''}>Outdoor</button>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">${lf?(lf==="indoor"?"Indoor":"Outdoor")+" · Courts":"Clubs · Courts"}</div><div class="v">${lf?courts:DATA.venues.length+" · "+courts}</div></div>
      <div class="kpi"><div class="l">Ø Auslastung${lf?" "+(lf==="indoor"?"Indoor":"Outdoor"):" Berlin"}</div><div class="v">${pct(occ)}</div></div>
      <div class="kpi"><div class="l">Umsatz gesamt</div><div class="v acc">${eur(rev)}</div>${lf?"":`<div class="x" style="font-size:11px;color:var(--faint);margin-top:3px">${eur(rev_m)} gemessen · ${eur(rev_e)} geschätzt</div>`}</div>
      <div class="kpi"><div class="l">Ø-Preis / Std.</div><div class="v">${eur(avgPrice)}</div></div>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px">
        <h3 style="margin:0">Verlauf · ${xachse}</h3>
        <div class="seg" id="chartseg" style="padding:2px">
          <button data-cm="occ"${chartMode==="occ"?' class="on"':''}>Auslastung</button>
          <button data-cm="rev"${chartMode==="rev"?' class="on"':''}>Umsatz</button>
        </div>
      </div>
      ${chart}
    </div>
    <div class="two">
      <div class="card"><h3>Auslastung &amp; Umsatz nach Court-Typ${lf?" ("+(lf==="indoor"?"Indoor":"Outdoor")+")":" (ganz Berlin)"}</h3>${typeHtml}</div>
      <div class="card"><h3>Buchungen nach Tageszeit</h3>${barShares(tod,TODO,"var(--teal)")}</div>
    </div>
    <div class="two">
      <div class="card"><h3>Buchungen nach Wochentag · mit Ø Vorlauf</h3>${wdHtml}</div>
      <div class="card"><h3>Buchungen nach Länge</h3>${barShares(dur,DURO,"var(--warn)")}</div>
    </div>
    <div class="two">
      <div class="card"><h3>Vorlaufzeit · Anteil gemessener Buchungen</h3>${vorlaufHtml}</div>
      <div class="card"><h3>Top 5 nach Auslastung</h3>${topOcc.map(x=>tbar(x.name,x.occ,pct(x.occ),"var(--acc)")).join("")||'<div class="empty">–</div>'}</div>
    </div>
    <div class="two">
      <div class="card"><h3>Top 5 nach Umsatz</h3>${topRev.map(x=>tbar(x.name,x.rev/maxR,eur(x.rev),"var(--teal)")).join("")||'<div class="empty">–</div>'}</div>
    </div>`;
  // Umschalter-Events
  $("locseg").addEventListener("click",e=>{if(!e.target.dataset.loc)return;reportLoc=e.target.dataset.loc;renderReport(...currentRange());});
  $("chartseg").addEventListener("click",e=>{if(!e.target.dataset.cm)return;chartMode=e.target.dataset.cm;renderReport(...currentRange());});
}
function courtsOfLoc(v,lf){return (v.court_types||[]).filter(t=>t.label.toLowerCase().includes(lf)).reduce((a,t)=>a+t.courts,0);}

/* ---------- Karte (Heatmap) ---------- */
let MAP=null,HEAT=null,MARKERS=null;
function initMap(){
  MAP=L.map('map',{zoomControl:true,scrollWheelZoom:true}).setView([52.515,13.40],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OpenStreetMap',subdomains:'abc',maxZoom:19}).addTo(MAP);
  MARKERS=L.layerGroup().addTo(MAP);
}
function renderMap(from,to){
  if(typeof L==="undefined"){$("map").innerHTML='<div class="empty" style="padding:60px 0">Karte konnte nicht geladen werden (keine Internetverbindung zur Kartenquelle).</div>';return;}
  if(!MAP)initMap();
  const rows=DATA.venues.filter(v=>v.lat&&v.lng).map(v=>{const c=computeRange(v,from,to);
    return {v,hours:c.booked/60,occ:capOcc(c.cap?c.booked/c.cap:0),rev:c.rev};});
  const max=Math.max(1,...rows.map(r=>r.hours));
  const pts=rows.map(r=>[r.v.lat,r.v.lng,Math.max(0.05,r.hours/max)]);
  if(HEAT)MAP.removeLayer(HEAT);
  HEAT=L.heatLayer(pts,{radius:22,blur:12,minOpacity:0.4,max:1.0,
    gradient:{0.2:'#0d5e4a',0.4:'#2dd4a7',0.65:'#c2f24a',0.85:'#f0b429',1.0:'#ef4444'}}).addTo(MAP);
  MARKERS.clearLayers();
  rows.forEach(r=>{const m=L.circleMarker([r.v.lat,r.v.lng],
    {radius:5+14*(r.hours/max),color:'rgba(232,237,242,.7)',weight:1,fillColor:'#c2f24a',fillOpacity:0.05});
    m.bindTooltip(`<b>${r.v.name}</b><br>${Math.round(r.hours)} Std · ${Math.round(r.occ*100)}% · ${eur(r.rev)}`,{direction:'top',offset:[0,-4]});
    m.addTo(MARKERS);});
  setTimeout(()=>{try{MAP.invalidateSize()}catch(e){}},60);
}

function renderAll(){
  const[from,to]=currentRange();renderRangeLabel();
  $("clubs-view").style.display=tab==="clubs"?"":"none";
  $("report-view").style.display=tab==="report"?"":"none";
  $("map-view").style.display=tab==="map"?"":"none";
  $("clubs-controls").style.display=tab==="clubs"?"":"none";
  if(tab==="clubs"){renderKPIs(from,to);renderList(from,to);}
  else if(tab==="report"){renderReport(from,to);}
  else{renderMap(from,to);}
}

function init(){
  $("updated").textContent="aktualisiert "+new Date(DATA.updated_at).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  if(DATA.sample)$("sample-badge").innerHTML='<span class="sample">Beispieldaten – echte Zahlen nach Einrichtung</span>';
  $("foot").innerHTML="Zahlen sind Schätzungen aus öffentlich sichtbarer Verfügbarkeit (Snapshot-Vergleich). "+
    "»Gemessen« = live erfasste Buchungen, »geschätzt« = Belegung vor Beobachtungsbeginn. "+
    "Auslastung bezieht sich nur auf beobachtete Tage. Tageszeit/Wochentag/Länge basieren auf gemessenen Buchungen.";
  // Datumsfelder
  $("d-from").min=DATA.date_min;$("d-from").max=DATA.date_max;$("d-from").value=DATA.date_min;
  $("d-to").min=DATA.date_min;$("d-to").max=DATA.date_max;$("d-to").value=DATA.date_max;
  cFrom=DATA.date_min;cTo=DATA.date_max;

  $("seg").addEventListener("click",e=>{if(!e.target.dataset.p)return;preset=e.target.dataset.p;
    [...$("seg").children].forEach(b=>b.classList.toggle("on",b===e.target));
    $("daterange").classList.toggle("on",preset==="custom");renderAll();});
  $("d-from").addEventListener("change",e=>{cFrom=e.target.value;renderAll();});
  $("d-to").addEventListener("change",e=>{cTo=e.target.value;renderAll();});
  $("sort").addEventListener("change",e=>{sortBy=e.target.value;renderAll();});
  $("search").addEventListener("input",e=>{query=e.target.value;renderAll();});
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
    tab=t.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));renderAll();}));
  renderAll();
}

fetch("dashboard_data.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json();})
  .then(d=>{DATA=d;init();}).catch(()=>{DATA=FALLBACK;init();});
</script>
