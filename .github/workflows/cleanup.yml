name: Cleanup
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python cleanup_backlog.py
      - run: |
          git config user.name "padel-radar-bot"
          git config user.email "actions@github.com"
          git add -A data dashboard_data.json
          git commit -m "Backlog bereinigt [skip ci]" || exit 0
          git push origin HEAD:main
